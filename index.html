<!DOCTYPE html>
<html>
<head>
<title>Alarm Aktif</title>
</head>
 <style>
#video { transform: scale(2.5); transform-origin: center; }
</style>
<body>
<h1>Alarm Aktif</h1>
<video id="video" width="400" height="300" autoplay playsinline></video>
<script>
function playSiren() {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(440, ctx.currentTime);
osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 0.1);
gain.gain.setValueAtTime(0.5, ctx.currentTime);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.2);
}
navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
.then(stream => {
document.getElementById('video').srcObject = stream;
})
.catch(e => {
console.error(e);
alert('Kamera hatası oluştu.');
});
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
let lastFrame = null;
document.getElementById('video').addEventListener('play', function() {
canvas.width = this.width;
canvas.height = this.height;
setInterval(() => {
ctx.drawImage(this, 0, 0, canvas.width, canvas.height);
const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
if (lastFrame) {
let diff = 0;
for (let i = 0; i < currentFrame.length; i += 4) {
diff += Math.abs(currentFrame[i] - lastFrame[i]);
}
if (diff / (canvas.width * canvas.height) > 10) {
playSiren();
}
}
lastFrame = currentFrame;
}, 200);
});
</script>
</body>
</html>
